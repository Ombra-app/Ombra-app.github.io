     Elle est dessinee par bench/partage/carte_paris.py depuis les donnees de

<!-- Application embarquee (phase 3, palier 3) : AUCUN serveur applicatif -
     donnees tuilees statiques (data/paris/) + moteur de routage JS
     (moteur.js, parite Python verifiee au palier 2). Seule dependance
     reseau : les tuiles de fond OSM (limite documentee : sans reseau, le
     fond manque mais trottoirs, itineraire et instructions fonctionnent).
     Habillage (2026-09-02) : identite graphique Ombra (navy / teal / cream,
     Cormorant Garamond italic + Jost), ecran de chargement, legende, panneau
     resultat replie/deplie, attenuation des trottoirs quand un trajet est
     affiche. Aucune modification de moteur.js.
     Corrections d'affichage (2026-09-04, retours utilisateurs) : heros
     "94 % du trajet a l'ombre" (le chiffre seul etait pris pour une
     temperature) et detour "+X % vs le plus court", calcule contre le vrai
     plus court chemin du reseau (k = 0, penalite de traversee 0) et non plus
     contre la route Direct penalisee. Toujours aucune modification de
     moteur.js. -->
<!-- Mesure d'audience : GoatCounter (sans cookie, sans donnee personnelle).
     Le script est charge en asynchrone et echoue en silence hors ligne. Le code
     du site est dans GOATCOUNTER_CODE ci-dessous ; vide = aucune mesure. -->
<script>window.GOATCOUNTER_CODE = "ombra";</script>
<script>
  if (window.GOATCOUNTER_CODE) {
    const s = document.createElement("script");
    s.async = true; s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = `https://${window.GOATCOUNTER_CODE}.goatcounter.com/count`;
    document.head.appendChild(s);
  }
</script>
<script src="vendor/maplibre-gl.js"></script>
<script src="vendor/pmtiles.js"></script>
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<style>
  /* Polices auto-hebergees (vendor/fonts) : pas de dependance a un CDN,
     coherent avec la contrainte hors-ligne. Sous-ensemble latin uniquement. */
  @font-face { font-family: "Jost"; font-weight: 300; font-display: swap; src: url("vendor/fonts/jost-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 400; font-display: swap; src: url("vendor/fonts/jost-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 500; font-display: swap; src: url("vendor/fonts/jost-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; font-display: swap; src: url("vendor/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }

  :root {
    --navy: #070E1A; --teal: #38BDF8; --cream: #F2EDE7;
    --muted: rgba(242,237,231,.6); --line: rgba(242,237,231,.13); --fond-doux: rgba(242,237,231,.06);
    --ombre: #1565c0; --soleil: #f0a202;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", -apple-system, system-ui, sans-serif;
    --haut-h: 190px;   /* +50 px : la ligne de recherche */
  }
  html, body { margin: 0; height: 100%; font-family: var(--sans); font-weight: 300; color: var(--cream);
    background: var(--navy); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  #map { position: absolute; inset: 0; background: #EDE7DE; }
  button { font: inherit; color: inherit; }

  /* ---------- Ecran de chargement ---------- */
  #splash { position: fixed; inset: 0; z-index: 10; background: var(--navy); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 24px;
    transition: opacity .5s ease; }
  #splash.cache { opacity: 0; pointer-events: none; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #splash .marque { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 54px; line-height: 1; margin-top: 26px; }
  #splash .slogan { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); margin-top: 6px; }
  #splash .barre { width: 140px; height: 2px; border-radius: 1px; background: var(--line); margin-top: 44px; overflow: hidden; }
  #splash .barre > i { display: block; height: 100%; width: 0%; background: var(--teal); transition: width .18s ease-out; }
  #splash .etat { margin-top: 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #splash .pied { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(242,237,231,.35); }

  /* ---------- Bandeau haut ---------- */
  .panneau { position: absolute; z-index: 2; background: rgba(7,14,26,.96); box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  @supports (backdrop-filter: blur(1px)) { .panneau { background: rgba(7,14,26,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); } }
  #haut { top: 0; left: 0; right: 0; border-radius: 0 0 18px 18px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 13px; }
  #ligne1 { display: flex; align-items: baseline; gap: 10px; }
  #marque { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 27px; line-height: 1; }
  #date-wrap { margin-left: auto; position: relative; }
  #date { -webkit-appearance: none; appearance: none; background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 22px 4px 10px; font: 400 11.5px var(--sans); letter-spacing: .02em; }
  #date-wrap::after { content: ""; position: absolute; right: 10px; top: 50%; width: 5px; height: 5px; margin-top: -4px;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
  #heure-affichee { font-size: 23px; color: var(--teal); min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  #heure { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 8px 0 0; background: transparent; display: block; }
  #heure::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--teal) var(--pos, 50%), var(--line) var(--pos, 50%)); }
  #heure::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%;
    background: var(--navy); border: 2.5px solid var(--teal); box-shadow: 0 0 0 4px rgba(56,189,248,.16); }
  #heure::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
  #heure::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--teal); }
  #heure::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--navy); border: 2.5px solid var(--teal); }
  #ligne-recherche { position: relative; margin-top: 10px; }
  #recherche { width: 100%; box-sizing: border-box; padding: 9px 12px; font: inherit; font-size: 13px;
    color: var(--cream); background: var(--fond-doux); border: 1px solid var(--line); border-radius: 999px;
    outline: none; -webkit-appearance: none; appearance: none; }
  #recherche::placeholder { color: var(--muted); }
  #recherche:focus { border-color: var(--teal); }
  #recherche::-webkit-search-cancel-button { -webkit-appearance: none; }
  #suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 5; margin: 0; padding: 4px;
    list-style: none; background: rgba(7,14,26,.98); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); max-height: 46vh; overflow-y: auto; }
  #suggestions li { padding: 9px 11px; font-size: 13px; border-radius: 10px; cursor: pointer; }
  #suggestions li:hover, #suggestions li[aria-selected="true"] { background: var(--fond-doux); }
  #suggestions li small { display: block; color: var(--muted); font-size: 11px; margin-top: 2px; }
  #suggestions li.vide { color: var(--muted); cursor: default; }
  #ligne2 { display: flex; gap: 7px; margin-top: 12px; }
  #modes { flex: 1; display: flex; background: var(--fond-doux); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  #modes button { flex: 1; padding: 8px 0; font-size: 12px; font-weight: 400; color: var(--muted); background: transparent;
    border: 0; border-radius: 999px; white-space: nowrap; cursor: pointer; }
  #modes button.actif { background: var(--teal); color: var(--navy); font-weight: 500; }
  .icone { flex: 0 0 38px; display: grid; place-items: center; background: var(--fond-doux); border: 1px solid var(--line);
    border-radius: 999px; padding: 0; cursor: pointer; }
  .icone svg { width: 17px; height: 17px; stroke: var(--cream); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icone.actif svg { stroke: var(--teal); }

  /* ---------- Legende ---------- */
  #legende { position: absolute; z-index: 2; left: 10px; top: calc(var(--haut-h) + 10px); display: inline-flex; gap: 11px; align-items: center;
    background: rgba(7,14,26,.86); border-radius: 999px; padding: 6px 12px; font-size: 11px; color: var(--cream); }
  #legende[hidden] { display: none; }
  #legende i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #legende em { font-style: normal; color: var(--muted); }
  .maplibregl-ctrl-top-right { top: calc(var(--haut-h) + 6px); }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  /* ---------- Panneau resultat ---------- */
  #bas { left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); border-radius: 18px; padding: 8px 18px 14px;
    max-height: 62vh; display: flex; flex-direction: column; }
  #poignee { width: 36px; height: 4px; border-radius: 2px; background: rgba(242,237,231,.22); margin: 0 auto 10px; flex: none; }
  #statut { font-size: 13px; color: var(--muted); line-height: 1.45; }
  #statut[hidden] { display: none; }
  #resultat[hidden] { display: none; }
  #hero { display: flex; align-items: baseline; gap: 8px; }
  #pct { font-size: 46px; line-height: .9; color: var(--teal); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #pct:empty { display: none; }
  #pct small { font-size: 23px; }
  /* Le libelle complete le chiffre ("94 % du trajet a l'ombre") : sans le mot
     "trajet", le gros pourcentage a ete pris pour une temperature. Sur 390 px
     de large il passe sur deux lignes ("du trajet" / "a l'ombre", espace
     insecable entre "a" et "l'ombre") plutot que de raccourcir ou de reduire
     le chiffre. */
  #hero em { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 24px; line-height: 1.05; min-width: 0; }
  #mode-aff { margin-left: auto; flex: none; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #sous { margin-top: 7px; font-size: 12px; color: var(--muted); }
  #sous b { font-weight: 400; color: var(--cream); }
  #sous .alerte { color: var(--soleil); }
  #etapes { list-style: none; margin: 12px 0 0; padding: 9px 0 0; border-top: 1px solid var(--line); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #etapes li { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; font-size: 13px; }
  #etapes .rue { flex: 1; font-weight: 400; min-width: 0; }
  #etapes .rue small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 300; margin-top: 1px; }
  #etapes .mes { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  #etapes .mes b { font-weight: 400; color: var(--cream); }
  #etapes li.trav { padding: 2px 0; font-size: 10.5px; color: var(--muted); align-items: center; }
  #etapes li.trav svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #bas.replie #etapes { display: none; }
  #bas.replie #poignee { margin-bottom: 8px; }

  /* ---------- Bouton "Y aller" (planificateur -> guidage, decision 5) ---------- */
  #btn-aller { display: block; width: 100%; margin-top: 12px; padding: 12px; border: 0; border-radius: 999px; background: var(--teal); color: var(--navy);
    font-size: 15px; font-weight: 500; letter-spacing: .02em; cursor: pointer; }
  #btn-aller[hidden] { display: none; }
  #bas.replie #btn-aller { margin-top: 10px; }

  /* ---------- Mode guidage (decision 5 : un mode, pas une page ; decision 7 : niveau rue) ---------- */
  body.guidage #haut, body.guidage #bas, body.guidage #legende, body.guidage .maplibregl-ctrl-top-right { display: none; }
  #guidage { display: none; }
  body.guidage #guidage { display: block; }
  #g-haut { position: absolute; z-index: 3; left: 12px; right: 12px; top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 12px; align-items: center;
    background: rgba(7,14,26,.94); border-radius: 18px; padding: 13px 14px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  #g-icone { flex: 0 0 48px; height: 48px; border-radius: 50%; border: 1.5px solid var(--teal); color: var(--teal); display: grid; place-items: center; font-size: 26px; }
  #g-txt { min-width: 0; flex: 1; }
  #g-dist { font-size: 30px; font-weight: 500; line-height: 1; font-variant-numeric: tabular-nums; }
  #g-action { font-size: 16px; font-weight: 400; line-height: 1.25; margin-top: 4px; }
  #g-detail { font-size: 13px; color: var(--muted); line-height: 1.3; margin-top: 2px; }
  #g-recentrer { position: absolute; z-index: 3; right: 14px; bottom: calc(112px + env(safe-area-inset-bottom)); width: 44px; height: 44px; border-radius: 50%;
    border: 1px solid rgba(242,237,231,.25); background: rgba(7,14,26,.9); color: var(--teal); font-size: 22px; display: grid; place-items: center; cursor: pointer; }
  #g-recentrer[hidden] { display: none; }
  #g-bas { position: absolute; z-index: 3; left: 0; right: 0; bottom: 0; background: rgba(7,14,26,.96); border-radius: 22px 22px 0 0;
    padding: 14px 18px calc(18px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.35); }
  #g-ligne { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #g-hero { display: flex; align-items: baseline; gap: 10px; white-space: nowrap; min-width: 0; }
  #g-minutes { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 34px; line-height: 1; }
  #g-hero span { font-size: 14px; color: var(--muted); }
  #g-pct { color: var(--cream); font-weight: 400; }
  #g-restant { font-weight: 300; }
  #g-arreter { flex: none; font-size: 13px; font-weight: 400; color: var(--cream); background: transparent; border: 1px solid rgba(242,237,231,.32);
    border-radius: 999px; padding: 8px 15px; cursor: pointer; }
  #g-mention { margin-top: 8px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  #g-statut { margin-top: 6px; font-size: 12px; color: var(--soleil); }
  #g-statut:empty { display: none; }
  #g-trace { margin-top: 8px; font-size: 12px; color: var(--teal); background: transparent; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
  #g-trace[hidden] { display: none; }
  /* ---------- Reglages en marchant (2026-09-08) ----------
     Le mode d'ombre, la journee et l'heure restent accessibles pendant la
     navigation : ils sont DEPLACES ici a l'entree en guidage et rendus au
     panneau du haut a la sortie, pour n'avoir qu'un seul jeu de commandes et
     un seul gestionnaire. Replies par defaut : en marchant, l'instruction
     prime. */
  #g-reglages-btn { margin-top: 8px; font-size: 12px; color: var(--teal); background: transparent; border: 0; padding: 0;
    cursor: pointer; text-decoration: underline; }
  #g-reglages { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  #g-reglages[hidden] { display: none; }
  #g-reglages #ligne1 { display: flex; align-items: center; gap: 10px; }
  #g-reglages #marque { display: none; }
  #g-reglages #heure { width: 100%; margin: 8px 0 10px; }

  @media (prefers-reduced-motion: reduce) { #splash, #splash .barre > i { transition: none; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="splash">
  <img src="icone-512.png" alt="">
  <div class="marque">Ombra</div>
  <div class="slogan">L'ombre à portée de pas</div>
  <div class="barre"><i id="splash-jauge"></i></div>
  <div class="etat" id="splash-etat">Chargement des ombres</div>
  <div class="pied" id="pied-perimetre"></div>
</div>

<div class="panneau" id="haut">
  <div id="ligne1">
    <span id="marque">Ombra</span>
    <span id="date-wrap"><select id="date" aria-label="Journée"></select></span>
    <span id="heure-affichee">--:--</span>
  </div>
  <input type="range" id="heure" min="0" max="0" step="1" value="0" aria-label="Heure de départ">
  <div id="ligne-recherche">
    <input type="search" id="recherche" autocomplete="off" autocapitalize="off" spellcheck="false"
           placeholder="Une adresse, un lieu" aria-label="Chercher une adresse ou un lieu"
           role="combobox" aria-expanded="false" aria-controls="suggestions">
    <ul id="suggestions" role="listbox" hidden></ul>
  </div>
  <div id="ligne2">
    <div id="modes">
      <button data-k="0" class="actif">Direct</button>
      <button data-k="1">Équilibré</button>
      <button data-k="4">Ombre max</button>
    </div>
    <button class="icone" id="btn-geoloc" title="Partir de ma position" aria-label="Partir de ma position">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="icone" id="btn-effacer" title="Effacer" aria-label="Effacer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<div id="legende" hidden>
  <span><i style="background:var(--ombre)"></i>à l'ombre</span>
  <span><i style="background:var(--soleil)"></i>au soleil</span>
  <em id="legende-heure"></em>
</div>

<div class="panneau replie" id="bas">
  <div id="poignee"></div>
  <div id="statut">Chargement…</div>
  <div id="resultat" hidden>
    <div id="hero"><span id="pct"></span><em id="hero-libelle">du trajet à&nbsp;l'ombre</em><span id="mode-aff"></span></div>
    <div id="sous"></div>
    <button id="btn-aller" type="button">Y aller</button>
    <ol id="etapes"></ol>
  </div>
</div>

<div id="guidage">
  <div id="g-haut">
    <div id="g-icone">↑</div>
    <div id="g-txt">
      <div id="g-dist">—</div>
      <div id="g-action">Démarrage…</div>
      <div id="g-detail"></div>
    </div>
  </div>
  <button id="g-recentrer" type="button" aria-label="Recentrer" hidden>◎</button>
  <div id="g-bas">
    <div id="g-ligne">
      <div id="g-hero"><em id="g-minutes">—</em><span><b id="g-restant"></b><b id="g-pct"></b></span></div>
      <button id="g-arreter" type="button">Arrêter</button>
    </div>
    <div id="g-mention"></div>

    <div id="g-reglages" hidden></div>
    <button id="g-trace" type="button" hidden>Partager la trace du test</button>
  </div>
</div>

<script type="module">
import { MoteurOmbra, wgs84VersL93 } from "./moteur.js";
import { ModeGuidage } from "./nav/mode_guidage.js";
import { Boussole } from "./nav/boussole.js";
import { Podometre } from "./nav/podometre.js";

const $ = (id) => document.getElementById(id);
const statutEl = $("statut"), resultatEl = $("resultat"), instructionsEl = $("etapes");
const dateSel = $("date"), heureInput = $("heure"), heureAff = $("heure-affichee");
const basEl = $("bas"), legendeEl = $("legende"), legendeHeure = $("legende-heure");
const MSG_INVITE = "Touchez la carte : départ, puis arrivée — ou le bouton ◎ pour partir de votre position.";

// Evenement de mesure (GoatCounter). Ne fait rien si le compteur n'est pas charge.
function mesure(nom) {
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: nom, title: nom, event: true }); } catch {}
}

// Hauteur reelle du bandeau -> position de la legende et de l'attribution.
const majHautH = () => document.documentElement.style.setProperty("--haut-h", $("haut").offsetHeight + "px");
new ResizeObserver(majHautH).observe($("haut"));
majHautH();

const lisJson = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); };
// Ville servie : data/<ville>/, "paris" par defaut. Un lien ?ville=pornic
// sert l'export de Pornic (test terrain du guidage, 2026-09-07) sans toucher
// au lien public. Le nom est borne a des lettres minuscules : c'est un chemin.
const VILLE = (/^[a-z]{2,20}$/.exec(new URLSearchParams(location.search).get("ville") ?? "") ?? ["paris"])[0];
const DONNEES = `data/${VILLE}/`;
const manifest = await lisJson(`${DONNEES}manifest.json`).catch((e) => {
  $("splash-etat").textContent = `Ville « ${VILLE} » indisponible (${e.message})`;
  throw e;
});

$("pied-perimetre").textContent = manifest.perimetre;

// Progression du chargement, affichee sur l'ecran d'accueil puis dans le
// statut. Le comptage enveloppe les deux chargeurs passes au moteur ; il
// porte sur le lot en cours (les tuiles visibles ou celles d'un trajet), et
// non plus sur la ville entiere : depuis le 2026-09-07 les tuiles sont
// chargees a la demande (Paris entier tiendrait 92 Mo et 690 Mo en memoire).
let chargesAttendus = 0, chargesFaits = 0;
function majProgres() {
  const pct = chargesAttendus ? Math.min(100, Math.round((100 * chargesFaits) / chargesAttendus)) : 0;
  $("splash-etat").textContent = `Chargement des ombres · ${pct} %`;
  $("splash-jauge").style.width = pct + "%";
}
function finProgres() {
  $("splash").classList.add("cache");
  legendeEl.hidden = false;
}
const suivi = (f) => async (...args) => {
  const r = await f(...args);
  chargesFaits += 1;
  majProgres();
  return r;
};
majProgres();

const moteur = new MoteurOmbra(
  manifest,
  suivi((id) => lisJson(`${DONNEES}tuiles/${id}.json`)),
  suivi((date, id) => lisJson(`${DONNEES}ombres/${date}/${id}.json`)),
);

// Chargement a la demande (2026-09-07). Deux sources de tuiles : route()
// charge celles du rectangle depart-arrivee (moteur.tuilesPourTrajet), et la
// carte charge celles qu'elle montre, des que le zoom rend les trottoirs
// lisibles (ZOOM_TROTTOIRS) et dans la limite de TUILES_VUE_MAX par vue. Une
// tuile fait 1 km de cote (manifest.taille_tuile_m, Lambert 93).
const ZOOM_TROTTOIRS = 14, TUILES_VUE_MAX = 24;
const idsTuiles = new Set(manifest.tuiles.map((t) => t.id));
function tuilesDansVue() {
  const b = map.getBounds(), taille = manifest.taille_tuile_m;
  const coins = [[b.getWest(), b.getSouth()], [b.getEast(), b.getSouth()], [b.getWest(), b.getNorth()], [b.getEast(), b.getNorth()]].map(([lo, la]) => wgs84VersL93(lo, la));
  const xs = coins.map((c) => c[0]), ys = coins.map((c) => c[1]);
  const ids = [];
  for (let tx = Math.floor(Math.min(...xs) / taille); tx <= Math.floor(Math.max(...xs) / taille); tx++)
    for (let ty = Math.floor(Math.min(...ys) / taille); ty <= Math.floor(Math.max(...ys) / taille); ty++)
      if (idsTuiles.has(`${tx}_${ty}`)) ids.push(`${tx}_${ty}`);
  return ids;
}
let chargementVue = null;
async function chargerVue() {
  if (map.getZoom() < ZOOM_TROTTOIRS) return;
  const ids = tuilesDansVue().filter((id) => !moteur.tuilesChargees.has(id) || !moteur.ombres.get(dateCalcul())?.tuiles.has(id));
  if (!ids.length || ids.length > TUILES_VUE_MAX) return;
  if (chargementVue) { await chargementVue; return chargerVue(); }
  chargesAttendus = ids.length * 2; chargesFaits = 0;
  chargementVue = (async () => {
    await moteur.chargeTuiles(ids);
    await majTrottoirs();
  })();
  try { await chargementVue; } finally { chargementVue = null; }
}

/* ---------- Apercu de la ville entiere (2026-09-08) ----------
   Le chargement a la demande ne sert le detail qu'a partir du zoom
   ZOOM_TROTTOIRS et par paquets de 24 tuiles : a l'echelle de Paris la carte
   restait grise, alors que c'est cette vue qui donne envie d'ouvrir
   l'application. On charge donc une couche legere (490 ko la journee : une
   ligne par rue au lieu d'un trait par trottoir, une valeur par heure au lieu
   d'une par quart d'heure) et on l'affiche SOUS ce zoom. Fabriquee par
   scripts/export_apercu.mjs. */
let apercu = null, apercuDate = null, apercuEnCours = null;

/** Meme degrade que la couche de detail, calcule ici : orange au soleil, bleu
 *  a l'ombre, gris quand l'ombre est indeterminee ou la valeur manquante. */
function couleurOmbre(v) {
  if (typeof v !== "number" || v === 255) return "#9e9e9e";
  const f = Math.max(0, Math.min(1, v / 100));
  const a = [240, 162, 2], b = [21, 101, 192];
  const c = a.map((x, i) => Math.round(x + f * (b[i] - x)));
  return `#${c.map((x) => x.toString(16).padStart(2, "0")).join("")}`;
}

/** Polyligne encodee (algorithme Google, precision 1e-5). */
function decodePolyligne(s) {
  const pts = []; let i = 0, lat = 0, lon = 0;
  while (i < s.length) {
    for (let cible = 0; cible < 2; cible++) {
      let shift = 0, resultat = 0, b;
      do { b = s.charCodeAt(i++) - 63; resultat |= (b & 0x1f) << shift; shift += 5; } while (b >= 0x20);
      const d = (resultat & 1) ? ~(resultat >> 1) : resultat >> 1;
      if (cible === 0) lat += d; else lon += d;
    }
    pts.push([lon * 1e-5, lat * 1e-5]);
  }
  return pts;
}

async function chargeApercu(date) {
  if (apercuDate === date && apercu) return apercu;
  if (apercuEnCours) { try { await apercuEnCours; } catch {} if (apercuDate === date) return apercu; }
  apercuEnCours = (async () => {
    const r = await fetch(`${DONNEES}apercu/${date}.json`, { cache: "force-cache" });
    if (!r.ok) throw new Error(`apercu ${date} : ${r.status}`);
    const a = await r.json();
    apercu = { pas: a.pas, geom: a.g.map(decodePolyligne),
               v: a.v.map((b) => Uint8Array.from(atob(b), (c) => c.charCodeAt(0))) };
    apercuDate = date;
    return apercu;
  })();
  try { return await apercuEnCours; } finally { apercuEnCours = null; }
}

/** Recolore l'apercu a l'heure choisie (le pas d'apercu le plus proche). */
function majApercu() {
  if (!apercu || !carteEnPlace()) return;
  const heure = pasListe[heureInput.value];
  let j = 0, mieux = Infinity;
  const minutes = (h) => Number(h.slice(0, 2)) * 60 + Number(h.slice(3, 5));
  apercu.pas.forEach((h, i) => { const d = Math.abs(minutes(h) - minutes(heure)); if (d < mieux) { mieux = d; j = i; } });
  // Les DEUX proprietes sont toujours ecrites : l'expression de couleur teste
  // `indetermine` comme un booleen, et une propriete absente vaut null, ce qui
  // fait echouer le ["case"] en silence (MapLibre se contente d'un
  // avertissement "Expected value to be of type boolean, but found null" et ne
  // dessine plus rien). Trouve le 2026-09-08 : la couche existait, la source
  // etait remplie, et l'ecran restait gris.
  const features = apercu.geom.map((coords, k) => {
    const v = apercu.v[k]?.[j];
    return { type: "Feature", properties: { couleur: couleurOmbre(v) },
             geometry: { type: "LineString", coordinates: coords } };
  });
  map.getSource("apercu").setData({ type: "FeatureCollection", features });
}

/** L'apercu ne doit rien couter au demarrage : charge en tache de fond, et son
 *  absence n'est jamais bloquante (une ville peut ne pas en avoir). */
function apercuEnFond(date) {
  chargeApercu(date).then(majApercu).catch((e) => console.warn("apercu indisponible :", e.message));
}

// Libelle de date lisible ("ven. 29 août") ; la valeur reste la cle ISO.
const libelleDate = (iso) => {
  try { return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); }
  catch { return iso; }
};
// Le selecteur propose des JOURS DU CALENDRIER, pas les journees calculees.
// L'ombre bouge peu d'un jour a l'autre : une journee de reference en sert une
// dizaine autour d'elle, et `manifest.jours` dit laquelle sert quoi. L'ecart
// est borne a l'export (2 degres d'elevation solaire, environ 1,4 m de bord
// d'ombre) ; un jour au-dela n'est simplement pas propose. L'utilisateur n'a
// pas a connaitre ce decoupage : il ouvre l'application un mardi, il voit
// mardi.
// Un export sans table `jours` (Pornic, exports anterieurs au 2026-09-08)
// retombe sur ses dates calculees, comme avant.
const jours = manifest.jours ?? Object.fromEntries(Object.keys(manifest.dates).map((d) => [d, d]));
const dates = Object.keys(jours).sort();
for (const d of dates) { const o = document.createElement("option"); o.value = d; o.textContent = libelleDate(d); dateSel.appendChild(o); }
// Journee calculee qui sert le jour choisi. Tout ce qui parle au moteur passe
// par ici ; tout ce qui parle a l'utilisateur passe par `dateSel.value`.
const dateCalcul = () => jours[dateSel.value] ?? dateSel.value;
// Date du jour (heure locale de l'appareil) si elle est servie ; sinon le
// premier jour a venir (un visiteur de la veille voit le lendemain, pas le
// dernier jour) ; sinon le dernier jour servi.
const maintenant = new Date();
const aujourdhui = `${maintenant.getFullYear()}-${String(maintenant.getMonth() + 1).padStart(2, "0")}-${String(maintenant.getDate()).padStart(2, "0")}`;
dateSel.value = dates.includes(aujourdhui) ? aujourdhui : (dates.find((d) => d > aujourdhui) ?? dates[dates.length - 1]);

let pasListe = [];
function majHeureAff() {
  const h = pasListe[heureInput.value];
  heureAff.textContent = h;
  legendeHeure.textContent = `à ${h}`;
  const pos = heureInput.max > 0 ? (100 * heureInput.value / heureInput.max) : 0;
  heureInput.style.setProperty("--pos", pos + "%");
}
function majDate() {
  pasListe = manifest.dates[dateCalcul()];
  heureInput.min = 0; heureInput.max = pasListe.length - 1;
  const quinze = pasListe.indexOf("15:00");
  heureInput.value = quinze >= 0 ? quinze : Math.floor(pasListe.length / 2);
  majHeureAff();
}
majDate();

// Les ombres du jour sont chargees ici, et non dans map.on("load") : MapLibre
// n'emet "load" qu'apres son premier rendu, et un navigateur suspend le rendu
// d'un onglet en arriere-plan. Sans cela, quiconque ouvre le lien puis change
// d'application reste bloque sur l'ecran de chargement (defaut constate en
// reel le 2026-09-02, corrige sur bars.html le 2026-09-04, reporte ici le
// 2026-09-06). Les donnees sont pretes des la fin du chargement ; la carte se
// peuple quand elle s'affiche.
// Aucune tuile n'est chargee ici : la carte charge ce qu'elle montre
// (chargerVue) et route() ce dont un trajet a besoin.
finProgres();
statutEl.textContent = MSG_INVITE;

let kActuel = 0, points = [], calculEnCours = 0, dernierResultat = null;
const LIBELLE_MODE = { 0: "Direct", 1: "Équilibré", 4: "Ombre max" };
// Reference du pourcentage de detour ("+X % vs le plus court") : le VRAI plus
// court chemin du reseau, meme A* a k = 0 et penalite de traversee 0
// (parametre optionnel facteurTraversee du moteur, defaut 1 : moteur.js
// intouche). Le mode Direct garde ses penalites (15 m passage pieton, 30 m
// carrefour) : c'est un itineraire marchable qui evite les traversees, pas le
// plus court, et il est compare a la meme reference que les deux autres.
// Calculee une fois par couple depart/arrivee (elle ne depend ni du mode ni
// de l'heure : a k = 0 l'ombre n'entre pas dans le cout), jamais affichee
// sur la carte. Le plafond de detour x1,5 du moteur reste base sur la route
// Direct penalisee (contrat de parite Python/JS, graph.route_avec_plafond).
let reference = null; // { cle, distance_m }
async function referenceDetour() {
  const cle = points.map((p) => p.join(",")).join("|");
  if (!reference || reference.cle !== cle) {
    const ref = await moteur.route({
      depart: points[0], arrivee: points[1], k: 0, facteurTraversee: 0,
      date: dateCalcul(), heure: pasListe[heureInput.value],
    });
    reference = { cle, distance_m: ref.reachable ? ref.distance_m : null };
  }
  return reference.distance_m;
}

const [lonMin, latMin, lonMax, latMax] = manifest.bbox_wgs84;
// Fond vectoriel (decision 2026-09-09, style proche de Plans d'Apple) : quand
// la ville a un vecteur.pmtiles (scripts/export_vectoriel.py), on l'utilise a
// la place du fond raster OpenStreetMap. Deux raisons : le style (couleurs,
// police Inter) devient personnalisable, et surtout les noms de rue restent
// lisibles quand la carte tourne (composes par MapLibre, pas dessines dans une
// image qui tourne avec elle - le probleme qui avait fait revenir au nord fixe
// le 2026-09-09). Sans ce fichier (Pornic, pour l'instant), on retombe sur
// l'ancien fond raster : rien ne casse, voir orientationParDefaut plus bas.
const vecteurDispo = await fetch(`${DONNEES}vecteur.pmtiles`, { method: "HEAD" }).then((r) => r.ok).catch(() => false);
let styleCarte;
if (vecteurDispo) {
  const protocolePM = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocolePM.tile);
  protocolePM.add(new pmtiles.PMTiles(`${DONNEES}vecteur.pmtiles`));
  styleCarte = {
    version: 8,
    glyphs: "vendor/glyphes/{fontstack}/{range}.pbf",
    sources: { ombra_vecteur: { type: "vector", url: `pmtiles://${DONNEES}vecteur.pmtiles` } },
    layers: [
      { id: "fond", type: "background", paint: { "background-color": "#F2E9DA" } },
      // Eau et vegetation : ne dessinent rien tant que data/water.parquet et
      // data/vegetation.parquet n'existent pas (scripts/ingest_eau_parcs.py,
      // a lancer par Jean-Philippe - reseau bloque depuis Claude). Aucun
      // risque a les laisser presentes par avance.
      { id: "eau", type: "fill", source: "ombra_vecteur", "source-layer": "eau",
        paint: { "fill-color": "#A9D3E3" } },
      { id: "vegetation", type: "fill", source: "ombra_vecteur", "source-layer": "vegetation",
        paint: { "fill-color": "#C6DFAE" } },
      { id: "batiments", type: "fill", source: "ombra_vecteur", "source-layer": "batiments", minzoom: 13,
        paint: { "fill-color": "#E4DBC6", "fill-opacity": ["interpolate", ["linear"], ["zoom"], 13, 0, 14, 1] } },
      { id: "rues-mineures-casing", type: "line", source: "ombra_vecteur", "source-layer": "rues", minzoom: 14,
        filter: ["in", ["get", "highway"], ["literal", ["residential", "unclassified", "living_street", "service"]]],
        paint: { "line-color": "#DCD0AF", "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 14, 1.4, 18, 9] } },
      { id: "rues-mineures", type: "line", source: "ombra_vecteur", "source-layer": "rues", minzoom: 14,
        filter: ["in", ["get", "highway"], ["literal", ["residential", "unclassified", "living_street", "service"]]],
        paint: { "line-color": "#FFFFFF", "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 14, 0.6, 18, 7] } },
      { id: "pietonnes", type: "line", source: "ombra_vecteur", "source-layer": "rues", minzoom: 15,
        filter: ["==", ["get", "highway"], "pedestrian"],
        paint: { "line-color": "#DCE7D2", "line-width": ["interpolate", ["linear"], ["zoom"], 15, 1, 18, 5] } },
      { id: "rues-moyennes-casing", type: "line", source: "ombra_vecteur", "source-layer": "rues",
        filter: ["in", ["get", "highway"], ["literal", ["tertiary", "secondary"]]],
        paint: { "line-color": "#DCD0AF", "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 11, 0.6, 18, 12] } },
      { id: "rues-moyennes", type: "line", source: "ombra_vecteur", "source-layer": "rues",
        filter: ["in", ["get", "highway"], ["literal", ["tertiary", "secondary"]]],
        paint: { "line-color": "#FFFFFF", "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 11, 0.3, 18, 9.5] } },
      { id: "rues-majeures-casing", type: "line", source: "ombra_vecteur", "source-layer": "rues",
        filter: ["in", ["get", "highway"], ["literal", ["primary", "trunk"]]],
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#DCD0AF", "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.8, 18, 15] } },
      { id: "rues-majeures", type: "line", source: "ombra_vecteur", "source-layer": "rues",
        filter: ["in", ["get", "highway"], ["literal", ["primary", "trunk"]]],
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#FFFFFF", "line-width": ["interpolate", ["exponential", 1.4], ["zoom"], 10, 0.5, 18, 12.5] } },
      { id: "noms-rues", type: "symbol", source: "ombra_vecteur", "source-layer": "rues", minzoom: 14,
        filter: ["!", ["in", ["get", "highway"], ["literal", ["service"]]]],
        layout: { "symbol-placement": "line", "text-field": ["get", "name"], "text-font": ["Inter Regular"],
                  "text-size": ["interpolate", ["linear"], ["zoom"], 14, 10, 18, 14], "text-letter-spacing": 0.01,
                  "text-max-angle": 40, "symbol-spacing": 300 },
        paint: { "text-color": "#6B6355", "text-halo-color": "#F2E9DA", "text-halo-width": 1.4 } },
    ],
  };
} else {
  styleCarte = { version: 8, sources: { osm: { type: "raster",
    tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256,
    attribution: "&copy; OpenStreetMap contributors" } },
    // Fond "papier" (decision 7, 2026-09-06) : les tuiles OpenStreetMap desaturees
    // et adoucies, puis voilees de creme (couche "voile" ci-dessous), pour que la
    // trace ombre / soleil et les trottoirs colores soient les seuls a porter de
    // la couleur. Memes tuiles, aucune donnee nouvelle. Fond de repli tant qu'une
    // ville n'a pas de vecteur.pmtiles (scripts/export_vectoriel.py).
    layers: [{ id: "osm", type: "raster", source: "osm", paint: { "raster-saturation": -0.85, "raster-contrast": -0.12, "raster-brightness-min": 0.08 } }] };
}
const map = new maplibregl.Map({
  container: "map",
  style: styleCarte,
  bounds: [[lonMin, latMin], [lonMax, latMax]], fitBoundsOptions: { padding: { top: 150, bottom: 110, left: 20, right: 20 } },
  attributionControl: false,
});
map.addControl(new maplibregl.AttributionControl({ compact: true }), "top-right");
window._map = map;   // piege connu (ETAT.md) : `map` n'est pas globale dans un module ; utile aux tests et au debogage

// Une propriete absente vaut null ; un ["case"] qui recoit null echoue, et
// MapLibre retombe alors sur la valeur par defaut de line-color, c'est-a-dire
// le NOIR, en se contentant d'un avertissement en console. Les tests de
// presence sont donc ecrits pour rendre toujours un booleen.
const couleurTrottoir = ["case",
  ["==", ["get", "indetermine"], true], "#9e9e9e",
  ["==", ["typeof", ["get", "fraction_ombre"]], "number"],
    ["interpolate", ["linear"], ["get", "fraction_ombre"], 0, "#f0a202", 1, "#1565c0"],
  "#9e9e9e"];
const couleurClasse = ["match", ["get", "classe"],
  "ombre", "#0b3d91", "soleil", "#e65100", "indetermine", "#616161", "#6a1b9a"];

// Quand un trajet est affiche, la couche trottoirs s'efface pour laisser
// ressortir le trace (meme palette, opacite reduite).
const OPACITE_TROTTOIRS = { libre: 1, trajet: 0.32 };
function attenuerTrottoirs(trajetAffiche) {
  for (const id of ["trottoirs", "apercu"]) if (map.getLayer(id)) map.setPaintProperty(id, "line-opacity", trajetAffiche ? OPACITE_TROTTOIRS.trajet : OPACITE_TROTTOIRS.libre);
}

map.on("load", async () => {
  if (!vecteurDispo) {
    // Voile creme du fond "papier" raster : un polygone monde, sous les trottoirs.
    // Inutile sur le fond vectoriel, qui a deja sa propre couleur de fond.
    map.addSource("voile", { type: "geojson", data: { type: "Feature", properties: {},
      geometry: { type: "Polygon", coordinates: [[[-180, -85], [180, -85], [180, 85], [-180, 85], [-180, -85]]] } } });
    map.addLayer({ id: "voile", type: "fill", source: "voile", paint: { "fill-color": "#F2EDE7", "fill-opacity": 0.30 } });
  }
  // Apercu de la ville entiere, SOUS le zoom ou le detail devient chargeable :
  // sans lui, la carte reste grise a l'echelle de Paris, faute de pouvoir
  // charger 144 Mo de trottoirs (voir scripts/export_apercu.mjs).
  map.addSource("apercu", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "apercu", type: "line", source: "apercu", maxzoom: ZOOM_TROTTOIRS,
    // La couleur est calculee en JS et portee par l'entite : une expression de
    // moins a evaluer 13 611 fois, et plus rien qui puisse retomber en noir.
    paint: { "line-color": ["coalesce", ["get", "couleur"], "#9e9e9e"], "line-opacity": OPACITE_TROTTOIRS.libre,
             "line-width": ["interpolate", ["linear"], ["zoom"], 10, 0.5, 12, 1.1, 14, 2.2] } });
  map.addSource("trottoirs", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "trottoirs", type: "line", source: "trottoirs",
    paint: { "line-color": couleurTrottoir, "line-width": 2.5, "line-opacity": OPACITE_TROTTOIRS.libre } });
  map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "route-casing", type: "line", source: "route",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#fff", "line-width": 9, "line-opacity": .9 } });
  map.addLayer({ id: "route-marche", type: "line", source: "route",
    filter: ["!", ["in", ["get", "classe"], ["literal", ["traversee", "liaison"]]]],
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": couleurClasse, "line-width": 5 } });
  map.addLayer({ id: "route-traversee", type: "line", source: "route",
    filter: ["in", ["get", "classe"], ["literal", ["traversee", "liaison"]]],
    paint: { "line-color": "#6a1b9a", "line-width": 4, "line-dasharray": [1, 1.2] } });
  map.addSource("points", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "points", type: "circle", source: "points",
    paint: { "circle-radius": 8, "circle-color": ["match", ["get", "role"], "depart", "#00695c", "#6a1b9a"],
      "circle-stroke-width": 2.5, "circle-stroke-color": "#fff" } });
  map.on("click", (e) => poserPoint([e.lngLat.lng, e.lngLat.lat]));
  map.on("moveend", () => { chargerVue().catch((e) => console.error("chargement de la vue :", e)); });
  await chargerVue();
  apercuEnFond(dateCalcul());
  const dep = lireCoord("depart"), arr = lireCoord("arrivee");
  if (dep && arr) {
    poserPoint(dep); poserPoint(arr);
    if (new URLSearchParams(location.search).get("auto") === "1") {
      // On attend le resultat du calcul, puis on part comme si l'on avait
      // touche "Y aller".
      const attendre = setInterval(() => {
        if (!$("resultat").hidden && !$("btn-aller").hidden) { clearInterval(attendre); $("btn-aller").click(); }
      }, 400);
      setTimeout(() => clearInterval(attendre), 60000);
    }
  }
});

/** Vrai quand les sources de la carte existent (apres map.on("load")). */
const carteEnPlace = () => Boolean(map.getSource && map.getSource("trottoirs"));
async function majTrottoirs() {
  await moteur.chargeOmbres(dateCalcul());
  if (carteEnPlace()) map.getSource("trottoirs").setData(moteur.trottoirsGeoJSON(dateCalcul(), pasListe[heureInput.value]));
}

function majPoints() {
  if (!carteEnPlace()) return;
  map.getSource("points").setData({ type: "FeatureCollection", features: points.map((p, i) => ({
    type: "Feature", geometry: { type: "Point", coordinates: p },
    properties: { role: i === 0 ? "depart" : "arrivee" } })) });
}

function montrerStatut(texte) {
  resultatEl.hidden = true;
  statutEl.hidden = false;
  statutEl.textContent = texte;
  basEl.classList.add("replie");
}

function poserPoint(coord) {
  if (points.length >= 2) effacer(false);
  points.push(coord);
  majPoints();
  if (points.length === 1) { montrerStatut("Départ posé. Touchez l'arrivée."); return; }
  calculer();
}

/* GPS chaud (levier n°3, 2026-09-07) : le GPS met 20 a 30 s a se caler apres un
   demarrage a froid (trace de Pornic : position figee puis biaisee de 10 m).
   Des qu'un itineraire est affiche, si la position est deja autorisee, on
   garde le GPS eveille jusqu'a "Y aller" (3 min au plus). Aucune demande
   d'autorisation ici : c'est le bouton de position ou "Y aller" qui la fait. */
let chauffeId = null, chauffeFin = null;
function chauffeGPS() {
  if (chauffeId !== null || !navigator.geolocation || !navigator.permissions?.query) return;
  navigator.permissions.query({ name: "geolocation" }).then((p) => {
    if (p.state !== "granted" || chauffeId !== null) return;
    chauffeId = navigator.geolocation.watchPosition(() => {}, () => {}, { enableHighAccuracy: true, maximumAge: 0 });
    chauffeFin = setTimeout(arreteChauffeGPS, 180000);
  }).catch(() => {});
}
function arreteChauffeGPS() {
  if (chauffeId !== null) { navigator.geolocation.clearWatch(chauffeId); chauffeId = null; }
  if (chauffeFin) { clearTimeout(chauffeFin); chauffeFin = null; }
}

function effacer(toutEffacerUI = true) {
  arreteChauffeGPS();
  points = [];
  reference = null;
  dernierResultat = null;
  majPoints();
  if (carteEnPlace()) map.getSource("route").setData({ type: "FeatureCollection", features: [] });
  attenuerTrottoirs(false);
  instructionsEl.innerHTML = "";
  if (toutEffacerUI) montrerStatut(MSG_INVITE);
}

// "Rue de Turenne, cote ouest" -> { rue, cote } pour l'affichage (le moteur
// produit le texte sans accents ; on ne le modifie pas, on le presente).
function decomposeMarche(texte) {
  const m = /^(.*?),\s*cote\s+(\S+)$/.exec(texte);
  return m ? { rue: m[1], cote: `côté ${m[2]}` } : { rue: texte, cote: "" };
}
const svgTrav = () => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.innerHTML = '<path d="M4 12h16M14 6l6 6-6 6"/>';
  return s;
};

function rendreInstructions(instructions) {
  instructionsEl.innerHTML = "";
  let i = 0;
  while (i < instructions.length) {
    const inst = instructions[i];
    if (inst.type !== "marche") {
      // Traversees consecutives regroupees en une ligne.
      let n = 0, pieton = 0;
      while (i < instructions.length && instructions[i].type !== "marche") { n += 1; if (/pieton/.test(instructions[i].texte)) pieton += 1; i += 1; }
      const li = document.createElement("li");
      li.className = "trav";
      li.appendChild(svgTrav());
      let t = n === 1 ? "1 traversée" : `${n} traversées`;
      if (pieton === n) t += " au passage piéton";
      else if (pieton === 0) t += " au carrefour";
      li.appendChild(document.createTextNode(t));
      instructionsEl.appendChild(li);
      continue;
    }
    const { rue, cote } = decomposeMarche(inst.texte);
    const notes = [];
    if (cote) notes.push(cote);
    if (inst.indetermine) notes.push("passage couvert en partie");
    if (inst.confiance_faible) notes.push("fiabilité faible");
    const li = document.createElement("li");
    const nom = document.createElement("span"); nom.className = "rue"; nom.textContent = rue;
    if (notes.length) { const sm = document.createElement("small"); sm.textContent = notes.join(" · "); nom.appendChild(sm); }
    const mes = document.createElement("span"); mes.className = "mes";
    const b = document.createElement("b"); b.textContent = `${inst.distance_m} m`; mes.appendChild(b);
    if (inst.pct_ombre !== null) mes.appendChild(document.createTextNode(` · ${inst.pct_ombre} % ombre`));
    li.append(nom, mes);
    instructionsEl.appendChild(li);
    i += 1;
  }
}

async function calculer() {
  if (points.length !== 2) return;
  const id = ++calculEnCours;
  const etaitDeplie = !resultatEl.hidden && !basEl.classList.contains("replie");
  montrerStatut("Calcul…");
  const r = await moteur.route({
    depart: points[0], arrivee: points[1], k: kActuel,
    date: dateCalcul(), heure: pasListe[heureInput.value],
  });
  if (id !== calculEnCours) return;
  if (!r.reachable) { montrerStatut(r.message); return; }
  dernierResultat = { r, depart: points[0], arrivee: points[1], date: dateCalcul(), heure: pasListe[heureInput.value] };
  chauffeGPS();
  const plusCourt = await referenceDetour();
  if (id !== calculEnCours) return;
  mesure("itineraire-calcule");
  const { troncons, instructions } = moteur.detaillerTrace(r, points[0], points[1]);
  if (carteEnPlace()) map.getSource("route").setData({ type: "FeatureCollection", features: troncons.map((t) => ({
    type: "Feature", geometry: { type: "LineString", coordinates: t.coords }, properties: { classe: t.classe } })) });
  attenuerTrottoirs(true);

  // Heros : "94 % du trajet a l'ombre". Sans trottoir evalue sur le trajet
  // (points sur le meme segment, traversees seules), il n'y a pas de chiffre :
  // "ombre non evaluee" plutot qu'un "? %" bancal.
  const evaluable = r.fraction_ombre_trajet !== null;
  $("pct").innerHTML = evaluable ? `${Math.round(r.fraction_ombre_trajet * 100)}<small> %</small>` : "";
  $("hero-libelle").textContent = evaluable ? "du trajet à\u00a0l'ombre" : "ombre non évaluée";
  $("mode-aff").textContent = LIBELLE_MODE[r.k_demande] ?? `k = ${r.k_demande}`;
  const morceaux = [`<b>${Math.round(r.distance_m).toLocaleString("fr-FR")} m</b>`];
  // Detour par rapport au vrai plus court chemin du reseau (cf. referenceDetour),
  // sur les trois modes, masque quand il arrondit a 0 %. Le ratio_detour du
  // moteur (base Direct penalisee) n'est plus affiche.
  if (plusCourt) {
    const detour = Math.round((r.distance_m / plusCourt - 1) * 100);
    if (detour >= 1) morceaux.push(`+${detour} % vs le plus court`);
  }
  if (r.plafonne) morceaux.push(`<span class="alerte">détour plafonné, k = ${r.k_effectif}</span>`);
  morceaux.push(r.nb_traversees === 1 ? "1 traversée" : `${r.nb_traversees} traversées`);
  morceaux.push(`départ ${r.heure}`);
  $("sous").innerHTML = morceaux.join(" · ");
  rendreInstructions(instructions);

  // Premier resultat : panneau replie (la carte d'abord). Recalcul (mode,
  // heure) : on garde l'etat choisi par l'utilisateur.
  basEl.classList.toggle("replie", !etaitDeplie);
  statutEl.hidden = true;
  resultatEl.hidden = false;
}

// Panneau resultat : replie (resume seul) ou deplie (etapes). Toucher la
// poignee ou le resume bascule ; un glissement vertical aussi.
function basculerPanneau(deplier) {
  if (resultatEl.hidden) return;
  basEl.classList.toggle("replie", deplier === undefined ? !basEl.classList.contains("replie") : !deplier);
}
$("poignee").addEventListener("click", () => basculerPanneau());
$("hero").addEventListener("click", () => basculerPanneau());
let touchY0 = null;
basEl.addEventListener("touchstart", (e) => { touchY0 = e.touches[0].clientY; }, { passive: true });
basEl.addEventListener("touchend", (e) => {
  if (touchY0 === null) return;
  const dy = e.changedTouches[0].clientY - touchY0; touchY0 = null;
  if (dy < -30) basculerPanneau(true);
  else if (dy > 30 && instructionsEl.scrollTop === 0) basculerPanneau(false);
}, { passive: true });

document.querySelectorAll("#modes button[data-k]").forEach((b) => b.addEventListener("click", () => {
  kActuel = parseFloat(b.dataset.k);
  if (kActuel === 4) mesure("mode-ombre-max");
  document.querySelectorAll("#modes button[data-k]").forEach((x) => x.classList.toggle("actif", x === b));
  if (enGuidage()) { modeGuidage.changeReglages({ k: kActuel }); return; }
  calculer();
}));
$("btn-effacer").addEventListener("click", () => effacer());
/* --- Recherche d'adresses et de lieux -------------------------------------
   Deux sources, jamais indispensables : si elles ne repondent pas, la carte
   reste le moyen de poser un point, et on le dit.
   - Base Adresse Nationale : service public francais, prevu pour la saisie au
     fil de la frappe (50 requetes par seconde autorisees). Suggestions.
   - Nominatim (OpenStreetMap) : les lieux qu'une base d'adresses ignore (gares,
     monuments, parcs). Son reglement INTERDIT la saisie au fil de la frappe :
     interroge uniquement a la validation, et seulement en renfort. */
const rechercheEl = $("recherche"), suggestionsEl = $("suggestions");
const DELAI_FRAPPE_MS = 250, MIN_CARACTERES = 3, MAX_SUGGESTIONS = 6;
const centre = [(lonMin + lonMax) / 2, (latMin + latMax) / 2];
let frappeId = null, requeteEnCours = 0, resultats = [], surligne = -1;

const dansPerimetre = ([lon, lat]) =>
  lon >= lonMin - 0.01 && lon <= lonMax + 0.01 && lat >= latMin - 0.01 && lat <= latMax + 0.01;

async function chercheAdresses(q, signal) {
  const u = new URL("https://api-adresse.data.gouv.fr/search/");
  u.searchParams.set("q", q);
  u.searchParams.set("limit", String(MAX_SUGGESTIONS));
  u.searchParams.set("lon", centre[0].toFixed(4));
  u.searchParams.set("lat", centre[1].toFixed(4));
  const r = await fetch(u, { signal });
  if (!r.ok) throw new Error(`adresse ${r.status}`);
  const j = await r.json();
  return (j.features ?? []).map((f) => ({
    libelle: f.properties.name,
    detail: [f.properties.postcode, f.properties.city].filter(Boolean).join(" "),
    coord: f.geometry.coordinates,
  }));
}

async function chercheLieux(q, signal) {
  const u = new URL("https://nominatim.openstreetmap.org/search");
  u.searchParams.set("q", q);
  u.searchParams.set("format", "jsonv2");
  u.searchParams.set("limit", String(MAX_SUGGESTIONS));
  u.searchParams.set("viewbox", `${lonMin},${latMax},${lonMax},${latMin}`);
  u.searchParams.set("bounded", "1");
  u.searchParams.set("accept-language", "fr");   // sinon « Montparnasse Cemetery »
  const r = await fetch(u, { signal });
  if (!r.ok) throw new Error(`lieu ${r.status}`);
  const j = await r.json();
  return (j ?? []).map((x) => ({
    libelle: (x.name && x.name.trim()) || x.display_name.split(",")[0],
    detail: x.display_name.split(",").slice(1, 3).join(",").trim(),
    coord: [Number(x.lon), Number(x.lat)],
  }));
}

function montrerSuggestions(liste, message) {
  resultats = liste;
  surligne = -1;
  suggestionsEl.innerHTML = "";
  if (message) {
    const li = document.createElement("li");
    li.className = "vide";
    li.textContent = message;
    suggestionsEl.appendChild(li);
  }
  liste.forEach((res, i) => {
    const li = document.createElement("li");
    li.setAttribute("role", "option");
    li.dataset.i = String(i);
    li.textContent = res.libelle;
    if (res.detail) { const s = document.createElement("small"); s.textContent = res.detail; li.appendChild(s); }
    suggestionsEl.appendChild(li);
  });
  const visible = Boolean(liste.length || message);
  suggestionsEl.hidden = !visible;
  rechercheEl.setAttribute("aria-expanded", String(visible));
}

function fermerSuggestions() {
  suggestionsEl.hidden = true;
  rechercheEl.setAttribute("aria-expanded", "false");
  surligne = -1;
}

function choisirResultat(res) {
  fermerSuggestions();
  rechercheEl.blur();
  if (!dansPerimetre(res.coord)) {
    montrerStatut(`« ${res.libelle} » est hors du périmètre couvert (${manifest.perimetre}).`);
    return;
  }
  rechercheEl.value = "";
  poserPoint(res.coord);
  map.flyTo({ center: res.coord, zoom: Math.max(map.getZoom(), 15.5) });
}

rechercheEl.addEventListener("input", () => {
  const q = rechercheEl.value.trim();
  clearTimeout(frappeId);
  if (q.length < MIN_CARACTERES) { fermerSuggestions(); return; }
  frappeId = setTimeout(async () => {
    const mien = ++requeteEnCours;
    try {
      const liste = (await chercheAdresses(q)).filter((r) => dansPerimetre(r.coord));
      if (mien !== requeteEnCours) return;                 // une frappe plus recente a pris la main
      // Proposer une adresse de Toulouse quand on couvre Paris n'a pas de sens :
      // les resultats hors perimetre sont ecartes avant l'affichage, pas apres
      // le clic. La Base Adresse Nationale rend volontiers l'homonyme d'une rue
      // dans une autre ville.
      montrerSuggestions(liste, liste.length ? null : "Aucune adresse ici — entrée pour chercher un lieu");
    } catch {
      if (mien === requeteEnCours) montrerSuggestions([], "Recherche indisponible — touchez la carte");
    }
  }, DELAI_FRAPPE_MS);
});

rechercheEl.addEventListener("keydown", async (e) => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    if (!resultats.length) return;
    e.preventDefault();
    surligne = (surligne + (e.key === "ArrowDown" ? 1 : resultats.length - 1) + 1) % (resultats.length + 1) - 1;
    [...suggestionsEl.querySelectorAll("li[data-i]")].forEach((li, i) =>
      li.setAttribute("aria-selected", String(i === surligne)));
    return;
  }
  if (e.key === "Escape") { fermerSuggestions(); return; }
  if (e.key !== "Enter") return;
  e.preventDefault();
  if (surligne >= 0 && resultats[surligne]) { choisirResultat(resultats[surligne]); return; }
  const q = rechercheEl.value.trim();
  if (q.length < MIN_CARACTERES) return;
  // Un numero dans la saisie = une adresse : on prend la premiere proposition,
  // c'est ce que l'utilisateur attend. Sans numero, la saisie designe plutot un
  // lieu, et la base d'adresses repond alors par des homonymes de rue :
  // « Cimetiere du Montparnasse » rendait « Rue du Montparnasse ». On interroge
  // donc aussi OpenStreetMap et on laisse choisir.
  const ressembleAUneAdresse = /\d/.test(q);
  if (ressembleAUneAdresse && resultats.length) { choisirResultat(resultats[0]); return; }
  const adresses = resultats.slice();
  montrerSuggestions([], "Recherche du lieu…");
  const mien = ++requeteEnCours;
  try {
    const lieux = (await chercheLieux(q)).filter((r) => dansPerimetre(r.coord));
    if (mien !== requeteEnCours) return;
    const tout = [...lieux, ...adresses];
    if (tout.length === 1) { choisirResultat(tout[0]); return; }
    montrerSuggestions(tout, tout.length ? null : "Rien trouvé — touchez la carte");
  } catch {
    if (mien === requeteEnCours) montrerSuggestions([], "Recherche indisponible — touchez la carte");
  }
});

suggestionsEl.addEventListener("click", (e) => {
  const li = e.target.closest("li[data-i]");
  if (li) choisirResultat(resultats[Number(li.dataset.i)]);
});
document.addEventListener("click", (e) => {
  if (!e.target.closest("#ligne-recherche")) fermerSuggestions();
});

$("btn-geoloc").addEventListener("click", () => {
  if (!navigator.geolocation) { montrerStatut("Géolocalisation indisponible."); return; }
  montrerStatut("Recherche de votre position…");
  navigator.geolocation.getCurrentPosition((pos) => {
    const c = [pos.coords.longitude, pos.coords.latitude];
    const marge = 0.01; // ~1 km : hors du perimetre couvert -> message clair
    if (c[0] < lonMin - marge || c[0] > lonMax + marge || c[1] < latMin - marge || c[1] > latMax + marge) {
      montrerStatut("Vous êtes hors du périmètre couvert (" + manifest.perimetre + ") — touchez la carte à la place.");
      return;
    }
    effacer(false);
    poserPoint(c);
    map.flyTo({ center: c, zoom: 15.5 });
    montrerStatut("Départ = votre position. Touchez l'arrivée.");
  }, () => { montrerStatut("Position refusée ou indisponible — touchez la carte."); },
  { enableHighAccuracy: true, timeout: 8000 });
});
/* ---------- Mode guidage (phase 4) ----------
   "Y aller" bascule le meme ecran en guidage ; "Arreter" revient au
   planificateur avec l'itineraire toujours affiche (decision 5). Le guidage
   parle au niveau de la rue (decision 7). Toute la mecanique est dans
   nav/mode_guidage.js ; ici, seulement le branchement a l'ecran.
   Repetition (marcheur simule sur la trace) : ?repetition=1 dans l'URL (x1 en
   temps reel, ?repetition=20 pour vingt fois plus vite), ou automatiquement
   si la geolocalisation est indisponible. */
const modeGuidage = new ModeGuidage({
  map, moteur,
  ui: { icone: $("g-icone"), dist: $("g-dist"), action: $("g-action"), detail: $("g-detail"),
        minutes: $("g-minutes"), restant: $("g-restant"), pct: $("g-pct"), mention: $("g-mention"), btnRecentrer: $("g-recentrer") },
  surEtat: (e) => {
    if (e.etat === "erreur") $("g-statut").textContent = "Position indisponible : " + e.message;
    if (e.etat === "arrive") $("g-statut").textContent = "Arrivée. Touchez « Arrêter » pour revenir au planificateur.";
    if (e.etat === "demarre") { $("g-statut").textContent = ""; $("g-trace").hidden = true; mesure(e.repetition ? "guidage-repetition" : "guidage-demarre"); }
    if (e.etat === "position" && $("g-trace").hidden && (modeGuidage.trace_enregistree?.points.length ?? 0) >= 20) $("g-trace").hidden = false;
    if (e.etat === "ecart") $("g-statut").textContent = "Vous avez quitté l'itinéraire, recalcul…";
    if (e.etat === "recalcul") { $("g-statut").textContent = `Nouvel itinéraire : ${Math.round(e.longueur_m)} m, ${e.pctRue ?? "?"} % à l'ombre`; mesure("guidage-recalcul"); setTimeout(() => { if ($("g-statut").textContent.startsWith("Nouvel")) $("g-statut").textContent = ""; }, 8000); }
  },
});
const paramRepetition = new URLSearchParams(location.search).get("repetition");

/* ---------- Trajet pose par l'URL (simulateur local, 2026-09-09) ----------
   ?depart=lon,lat&arrivee=lon,lat&auto=1 pose les deux points, calcule et
   lance le guidage. Avec ?repetition=N, le marcheur est simule : de quoi
   regarder le navigateur se derouler dans Paris sans sortir. Sert au
   simulateur local (simulateur_paris.command) ; sans ces parametres,
   l'application se comporte exactement comme avant. */
const lireCoord = (nom) => {
  const v = new URLSearchParams(location.search).get(nom);
  if (!v) return null;
  const [lon, lat] = v.split(",").map(Number);
  return Number.isFinite(lon) && Number.isFinite(lat) ? [lon, lat] : null;
};
// ?ecart=1 (avec ?repetition) : le marcheur simule quitte le trajet a 40 % du parcours, 80 m de travers, puis revient.
const paramEcart = new URLSearchParams(location.search).get("ecart");

/* Heure du guidage : si la journee choisie est celle du jour et que l'heure
   reelle est a un autre pas de 15 min que l'heure choisie, on recalcule a
   l'heure reelle AVANT de partir, pour guider sur l'itineraire qu'on affiche
   (decision 2 appliquee des le depart). Sinon (autre journee, ou repetition)
   on garde l'itineraire tel quel et la feuille du bas le dit. */
function pasCourant() {
  const d = new Date();
  const m = Math.floor(d.getMinutes() / manifest.pas_minutes) * manifest.pas_minutes;
  const h = `${String(d.getHours()).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
  return pasListe.includes(h) ? h : null;
}
$("btn-aller").addEventListener("click", async () => {
  if (!dernierResultat) return;
  // Boussole : iOS n'accorde l'orientation de l'appareil que sur demande faite
  // dans le geste lui-meme, avant tout await (retour terrain du 2026-09-07).
  const boussole = await Boussole.autoriser();
  const podometre = await Podometre.autoriser();   // idem : accelerometre, dans le geste
  arreteChauffeGPS();
  const repetition = paramRepetition !== null ? Math.max(1, Number(paramRepetition) || 1) : (navigator.geolocation ? null : 1);
  let { r, depart, arrivee, date, heure } = dernierResultat;
  // Le jour CHOISI est-il aujourd'hui ? (`date` porte la journee calculee, qui
  // n'est presque jamais la date du jour depuis le 2026-09-08.)
  if (!repetition && dateSel.value === aujourdhui) {
    const hNow = pasCourant();
    if (hNow && hNow !== heure) {
      heureInput.value = pasListe.indexOf(hNow); majHeureAff();
      await majTrottoirs();
      const r2 = await moteur.route({ depart, arrivee, k: kActuel, date, heure: hNow });
      if (r2.reachable) { r = r2; heure = r2.heure; dernierResultat = { r, depart, arrivee, date, heure }; }
    }
  }
  document.body.classList.add("guidage");
  reglagesVersGuidage();
  const ecartDemo = repetition && paramEcart ? [{ a_m: 0.4 * r.distance_m, longueur_m: 80, cap_relatif_deg: 90 }] : [];
  // ?bruit=0 avec ?repetition : position exacte, pour juger le rendu.
  const paramBruit = new URLSearchParams(location.search).get("bruit");
  const bruit_m = paramBruit === null ? 5 : Math.max(0, Number(paramBruit) || 0);
  // ?orientation impose le choix ; sinon, direction de marche en haut seulement
  // si le fond vectoriel est actif (sur fond raster, les noms de rue sont
  // dessines dans l'image et tournent avec elle : nord fixe reste le repli).
  const orientation = new URLSearchParams(location.search).get("orientation") ?? (vecteurDispo ? "marche" : "nord");
  await modeGuidage.demarrer({ resultat: r, depart, arrivee, date, heure, repetition, k: kActuel, heureCourante: pasCourant, ecartDemo, bruit_m,
                               ...(orientation ? { orientation } : {}) });
  if (!repetition && (boussole === "denied" || podometre === "denied")) $("g-statut").textContent = `${boussole === "denied" ? "Boussole" : "Accéléromètre"} refusé${boussole === "denied" ? "e" : ""} : le guidage suivra le GPS seul.`;
});
$("g-arreter").addEventListener("click", () => {
  modeGuidage.arreter(); document.body.classList.remove("guidage"); $("g-trace").hidden = true;
  reglagesVersPlanificateur();
});

/* Enregistreur de trace (test terrain) : le bouton apparait apres 20 points
   GPS ; le fichier JSON part par la feuille de partage du telephone (Mail,
   Messages, AirDrop...), ou a defaut dans le presse-papier. La derniere trace
   reste aussi dans localStorage ("ombra.derniere_trace"). Rejeu :
   node pwa/nav/rejoue_trace.mjs trace.json */
async function partagerTrace() {
  const json = modeGuidage.exporterTrace();
  if (!json) return;
  const nom = `ombra_trace_${new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-")}.json`;
  try {
    const fichier = new File([json], nom, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [fichier] })) { await navigator.share({ files: [fichier], title: "Trace Ombra" }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(json); $("g-statut").textContent = "Trace copiée dans le presse-papier."; }
  catch { $("g-statut").textContent = "Partage impossible sur cet appareil."; }
}
$("g-trace").addEventListener("click", partagerTrace);
window._modeGuidage = modeGuidage;   // comme window._map : pour les tests de bout en bout (trace exportee)
window._reglages = { versGuidage: reglagesVersGuidage, versPlanificateur: reglagesVersPlanificateur };   // idem : deplacement des commandes
$("g-recentrer").addEventListener("click", () => modeGuidage.recentrer());

heureInput.addEventListener("input", () => { majHeureAff(); majApercu(); });
heureInput.addEventListener("change", async () => {
  await majTrottoirs();
  // L'heure VOULUE est celle du curseur, pas l'heure reelle : c'est tout
  // l'interet de pouvoir la changer en marchant.
  if (enGuidage()) { modeGuidage.changeReglages({ heure: pasListe[heureInput.value] }); return; }
  calculer();
});
dateSel.addEventListener("change", async () => {
  majDate(); apercuEnFond(dateCalcul()); await majTrottoirs();
  if (enGuidage()) { modeGuidage.changeReglages({ date: dateCalcul(), heure: pasListe[heureInput.value] }); return; }
  calculer();
});

/* ---------- Reglages en marchant (2026-09-08) ----------
   Un seul jeu de commandes : on DEPLACE la journee, l'heure et les modes dans
   le bandeau du guidage a l'entree, et on les rend au panneau du haut a la
   sortie. Dupliquer les boutons aurait fait deux etats a tenir d'accord. */
const enGuidage = () => document.body.classList.contains("guidage");
const reglagesEl = $("g-reglages"), reglagesBtn = $("g-reglages-btn");
let placeOrigine = null;
function reglagesVersGuidage() {
  if (placeOrigine) return;
  placeOrigine = true;
  reglagesEl.append($("ligne1"), heureInput, $("modes"));
  reglagesEl.hidden = true;
  reglagesBtn.textContent = "Changer l'heure ou le mode";
}
function reglagesVersPlanificateur() {
  if (!placeOrigine) return;
  placeOrigine = null;
  const haut = $("haut");
  haut.prepend($("ligne1"));
  $("ligne1").after(heureInput);
  $("ligne2").prepend($("modes"));
}
reglagesBtn.addEventListener("click", () => {
  reglagesEl.hidden = !reglagesEl.hidden;
  reglagesBtn.textContent = reglagesEl.hidden ? "Changer l'heure ou le mode" : "Masquer les réglages";
});
</script>
</body>
