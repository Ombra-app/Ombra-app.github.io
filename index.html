<!-- Application embarquee (phase 3, palier 3) : AUCUN serveur applicatif -
     donnees tuilees statiques (data/paris/) + moteur de routage JS
     (moteur.js, parite Python verifiee au palier 2). Seule dependance
     reseau : les tuiles de fond OSM (limite documentee : sans reseau, le
     fond manque mais trottoirs, itineraire et instructions fonctionnent).
     Habillage (2026-09-02) : identite graphique Ombra (navy / teal / cream,
     Cormorant Garamond italic + Jost), ecran de chargement, legende, panneau
     resultat replie/deplie, attenuation des trottoirs quand un trajet est
     affiche. Aucune modification de moteur.js.
     Corrections d'affichage (2026-09-04, retours utilisateurs) : heros
     "94 % du trajet a l'ombre" (le chiffre seul etait pris pour une
     temperature) et detour "+X % vs le plus court", calcule contre le vrai
     plus court chemin du reseau (k = 0, penalite de traversee 0) et non plus
     contre la route Direct penalisee. Toujours aucune modification de
     moteur.js. -->
<!-- Mesure d'audience : GoatCounter (sans cookie, sans donnee personnelle).
     Le script est charge en asynchrone et echoue en silence hors ligne. Le code
     du site est dans GOATCOUNTER_CODE ci-dessous ; vide = aucune mesure. -->
<script>window.GOATCOUNTER_CODE = "ombra";</script>
<script>
  if (window.GOATCOUNTER_CODE) {
    const s = document.createElement("script");
    s.async = true; s.src = "https://gc.zgo.at/count.js";
    s.dataset.goatcounter = `https://${window.GOATCOUNTER_CODE}.goatcounter.com/count`;
    document.head.appendChild(s);
  }
</script>
<script src="vendor/maplibre-gl.js"></script>
<link href="vendor/maplibre-gl.css" rel="stylesheet">
<style>
  /* Polices auto-hebergees (vendor/fonts) : pas de dependance a un CDN,
     coherent avec la contrainte hors-ligne. Sous-ensemble latin uniquement. */
  @font-face { font-family: "Jost"; font-weight: 300; font-display: swap; src: url("vendor/fonts/jost-latin-300-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 400; font-display: swap; src: url("vendor/fonts/jost-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Jost"; font-weight: 500; font-display: swap; src: url("vendor/fonts/jost-latin-500-normal.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 500; font-style: italic; font-display: swap; src: url("vendor/fonts/cormorant-garamond-latin-500-italic.woff2") format("woff2"); }

  :root {
    --navy: #070E1A; --teal: #38BDF8; --cream: #F2EDE7;
    --muted: rgba(242,237,231,.6); --line: rgba(242,237,231,.13); --fond-doux: rgba(242,237,231,.06);
    --ombre: #1565c0; --soleil: #f0a202;
    --serif: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --sans: "Jost", -apple-system, system-ui, sans-serif;
    --haut-h: 140px;
  }
  html, body { margin: 0; height: 100%; font-family: var(--sans); font-weight: 300; color: var(--cream);
    background: var(--navy); overscroll-behavior: none; -webkit-font-smoothing: antialiased; }
  #map { position: absolute; inset: 0; background: #e9e6e0; }
  button { font: inherit; color: inherit; }

  /* ---------- Ecran de chargement ---------- */
  #splash { position: fixed; inset: 0; z-index: 10; background: var(--navy); display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 0 24px;
    transition: opacity .5s ease; }
  #splash.cache { opacity: 0; pointer-events: none; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #splash .marque { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 54px; line-height: 1; margin-top: 26px; }
  #splash .slogan { font-family: var(--serif); font-style: italic; font-size: 20px; color: var(--muted); margin-top: 6px; }
  #splash .barre { width: 140px; height: 2px; border-radius: 1px; background: var(--line); margin-top: 44px; overflow: hidden; }
  #splash .barre > i { display: block; height: 100%; width: 0%; background: var(--teal); transition: width .18s ease-out; }
  #splash .etat { margin-top: 12px; font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  #splash .pied { position: absolute; bottom: max(28px, env(safe-area-inset-bottom)); font-size: 9px; letter-spacing: .14em;
    text-transform: uppercase; color: rgba(242,237,231,.35); }

  /* ---------- Bandeau haut ---------- */
  .panneau { position: absolute; z-index: 2; background: rgba(7,14,26,.96); box-shadow: 0 4px 18px rgba(0,0,0,.35); }
  @supports (backdrop-filter: blur(1px)) { .panneau { background: rgba(7,14,26,.9); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); } }
  #haut { top: 0; left: 0; right: 0; border-radius: 0 0 18px 18px;
    padding: calc(12px + env(safe-area-inset-top)) 16px 13px; }
  #ligne1 { display: flex; align-items: baseline; gap: 10px; }
  #marque { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 27px; line-height: 1; }
  #date-wrap { margin-left: auto; position: relative; }
  #date { -webkit-appearance: none; appearance: none; background: transparent; color: var(--muted); border: 1px solid var(--line);
    border-radius: 999px; padding: 4px 22px 4px 10px; font: 400 11.5px var(--sans); letter-spacing: .02em; }
  #date-wrap::after { content: ""; position: absolute; right: 10px; top: 50%; width: 5px; height: 5px; margin-top: -4px;
    border-right: 1px solid var(--muted); border-bottom: 1px solid var(--muted); transform: rotate(45deg); pointer-events: none; }
  #heure-affichee { font-size: 23px; color: var(--teal); min-width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
  #heure { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; margin: 8px 0 0; background: transparent; display: block; }
  #heure::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: linear-gradient(90deg, var(--teal) var(--pos, 50%), var(--line) var(--pos, 50%)); }
  #heure::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; margin-top: -7.5px; border-radius: 50%;
    background: var(--navy); border: 2.5px solid var(--teal); box-shadow: 0 0 0 4px rgba(56,189,248,.16); }
  #heure::-moz-range-track { height: 3px; border-radius: 2px; background: var(--line); }
  #heure::-moz-range-progress { height: 3px; border-radius: 2px; background: var(--teal); }
  #heure::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--navy); border: 2.5px solid var(--teal); }
  #ligne2 { display: flex; gap: 7px; margin-top: 12px; }
  #modes { flex: 1; display: flex; background: var(--fond-doux); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  #modes button { flex: 1; padding: 8px 0; font-size: 12px; font-weight: 400; color: var(--muted); background: transparent;
    border: 0; border-radius: 999px; white-space: nowrap; cursor: pointer; }
  #modes button.actif { background: var(--teal); color: var(--navy); font-weight: 500; }
  .icone { flex: 0 0 38px; display: grid; place-items: center; background: var(--fond-doux); border: 1px solid var(--line);
    border-radius: 999px; padding: 0; cursor: pointer; }
  .icone svg { width: 17px; height: 17px; stroke: var(--cream); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icone.actif svg { stroke: var(--teal); }

  /* ---------- Legende ---------- */
  #legende { position: absolute; z-index: 2; left: 10px; top: calc(var(--haut-h) + 10px); display: inline-flex; gap: 11px; align-items: center;
    background: rgba(7,14,26,.86); border-radius: 999px; padding: 6px 12px; font-size: 11px; color: var(--cream); }
  #legende[hidden] { display: none; }
  #legende i { display: inline-block; width: 16px; height: 3px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  #legende em { font-style: normal; color: var(--muted); }
  .maplibregl-ctrl-top-right { top: calc(var(--haut-h) + 6px); }
  .maplibregl-ctrl-attrib { font-size: 10px; }

  /* ---------- Panneau resultat ---------- */
  #bas { left: 10px; right: 10px; bottom: max(10px, env(safe-area-inset-bottom)); border-radius: 18px; padding: 8px 18px 14px;
    max-height: 62vh; display: flex; flex-direction: column; }
  #poignee { width: 36px; height: 4px; border-radius: 2px; background: rgba(242,237,231,.22); margin: 0 auto 10px; flex: none; }
  #statut { font-size: 13px; color: var(--muted); line-height: 1.45; }
  #statut[hidden] { display: none; }
  #resultat[hidden] { display: none; }
  #hero { display: flex; align-items: baseline; gap: 8px; }
  #pct { font-size: 46px; line-height: .9; color: var(--teal); font-variant-numeric: tabular-nums; white-space: nowrap; }
  #pct:empty { display: none; }
  #pct small { font-size: 23px; }
  /* Le libelle complete le chiffre ("94 % du trajet a l'ombre") : sans le mot
     "trajet", le gros pourcentage a ete pris pour une temperature. Sur 390 px
     de large il passe sur deux lignes ("du trajet" / "a l'ombre", espace
     insecable entre "a" et "l'ombre") plutot que de raccourcir ou de reduire
     le chiffre. */
  #hero em { font-family: var(--serif); font-style: italic; font-weight: 500; font-size: 24px; line-height: 1.05; min-width: 0; }
  #mode-aff { margin-left: auto; flex: none; font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  #sous { margin-top: 7px; font-size: 12px; color: var(--muted); }
  #sous b { font-weight: 400; color: var(--cream); }
  #sous .alerte { color: var(--soleil); }
  #etapes { list-style: none; margin: 12px 0 0; padding: 9px 0 0; border-top: 1px solid var(--line); overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #etapes li { display: flex; align-items: baseline; gap: 10px; padding: 6px 0; font-size: 13px; }
  #etapes .rue { flex: 1; font-weight: 400; min-width: 0; }
  #etapes .rue small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 300; margin-top: 1px; }
  #etapes .mes { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  #etapes .mes b { font-weight: 400; color: var(--cream); }
  #etapes li.trav { padding: 2px 0; font-size: 10.5px; color: var(--muted); align-items: center; }
  #etapes li.trav svg { width: 14px; height: 14px; stroke: var(--muted); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  #bas.replie #etapes { display: none; }
  #bas.replie #poignee { margin-bottom: 8px; }

  @media (prefers-reduced-motion: reduce) { #splash, #splash .barre > i { transition: none; } }
</style>
</head>
<body>
<div id="map"></div>

<div id="splash">
  <img src="icone-512.png" alt="">
  <div class="marque">Ombra</div>
  <div class="slogan">L'ombre à portée de pas</div>
  <div class="barre"><i id="splash-jauge"></i></div>
  <div class="etat" id="splash-etat">Chargement des ombres</div>
  <div class="pied">Démonstrateur · Paris, le Marais</div>
</div>

<div class="panneau" id="haut">
  <div id="ligne1">
    <span id="marque">Ombra</span>
    <span id="date-wrap"><select id="date" aria-label="Journée"></select></span>
    <span id="heure-affichee">--:--</span>
  </div>
  <input type="range" id="heure" min="0" max="0" step="1" value="0" aria-label="Heure de départ">
  <div id="ligne2">
    <div id="modes">
      <button data-k="0" class="actif">Direct</button>
      <button data-k="1">Équilibré</button>
      <button data-k="4">Ombre max</button>
    </div>
    <button class="icone" id="btn-geoloc" title="Partir de ma position" aria-label="Partir de ma position">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
    <button class="icone" id="btn-effacer" title="Effacer" aria-label="Effacer">
      <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
</div>

<div id="legende" hidden>
  <span><i style="background:var(--ombre)"></i>à l'ombre</span>
  <span><i style="background:var(--soleil)"></i>au soleil</span>
  <em id="legende-heure"></em>
</div>

<div class="panneau replie" id="bas">
  <div id="poignee"></div>
  <div id="statut">Chargement…</div>
  <div id="resultat" hidden>
    <div id="hero"><span id="pct"></span><em id="hero-libelle">du trajet à&nbsp;l'ombre</em><span id="mode-aff"></span></div>
    <div id="sous"></div>
    <ol id="etapes"></ol>
  </div>
</div>

<script type="module">
import { MoteurOmbra } from "./moteur.js";

const $ = (id) => document.getElementById(id);
const statutEl = $("statut"), resultatEl = $("resultat"), instructionsEl = $("etapes");
const dateSel = $("date"), heureInput = $("heure"), heureAff = $("heure-affichee");
const basEl = $("bas"), legendeEl = $("legende"), legendeHeure = $("legende-heure");
const MSG_INVITE = "Touchez la carte : départ, puis arrivée — ou le bouton ◎ pour partir de votre position.";

// Evenement de mesure (GoatCounter). Ne fait rien si le compteur n'est pas charge.
function mesure(nom) {
  try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({ path: nom, title: nom, event: true }); } catch {}
}

// Hauteur reelle du bandeau -> position de la legende et de l'attribution.
const majHautH = () => document.documentElement.style.setProperty("--haut-h", $("haut").offsetHeight + "px");
new ResizeObserver(majHautH).observe($("haut"));
majHautH();

const lisJson = async (u) => { const r = await fetch(u); if (!r.ok) throw new Error(`${u}: ${r.status}`); return r.json(); };
const manifest = await lisJson("data/paris/manifest.json");

// Progression du premier chargement, affichee sur l'ecran d'accueil. Le
// comptage enveloppe les deux chargeurs passes au moteur : aucune
// modification de moteur.js, donc aucun risque pour la parite Python/JS.
const CHARGES_ATTENDUS = manifest.tuiles.length * 2;   // tuiles + ombres du jour
let chargesFaits = 0;
function majProgres() {
  const pct = Math.min(100, Math.round((100 * chargesFaits) / CHARGES_ATTENDUS));
  $("splash-etat").textContent = `Chargement des ombres · ${pct} %`;
  $("splash-jauge").style.width = pct + "%";
}
function finProgres() {
  $("splash").classList.add("cache");
  legendeEl.hidden = false;
}
const suivi = (f) => async (...args) => {
  const r = await f(...args);
  chargesFaits += 1;
  majProgres();
  return r;
};
majProgres();

const moteur = new MoteurOmbra(
  manifest,
  suivi((id) => lisJson(`data/paris/tuiles/${id}.json`)),
  suivi((date, id) => lisJson(`data/paris/ombres/${date}/${id}.json`)),
);

// Perimetre demonstrateur : on charge tout d'emblee (1,6 Mo gzip). A
// l'echelle de Paris, ce prechargement deviendra paresseux comme le routage.
await moteur.chargeToutesLesTuiles();

// Libelle de date lisible ("ven. 29 août") ; la valeur reste la cle ISO.
const libelleDate = (iso) => {
  try { return new Date(iso + "T12:00:00").toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }); }
  catch { return iso; }
};
const dates = Object.keys(manifest.dates);
for (const d of dates) { const o = document.createElement("option"); o.value = d; o.textContent = libelleDate(d); dateSel.appendChild(o); }
// Date du jour (heure locale de l'appareil) si elle est exportee ; sinon la
// premiere date a venir (un visiteur de la veille voit le lendemain, pas le
// dernier jour) ; sinon la derniere date exportee.
const maintenant = new Date();
const aujourdhui = `${maintenant.getFullYear()}-${String(maintenant.getMonth() + 1).padStart(2, "0")}-${String(maintenant.getDate()).padStart(2, "0")}`;
dateSel.value = dates.includes(aujourdhui) ? aujourdhui : (dates.find((d) => d > aujourdhui) ?? dates[dates.length - 1]);

let pasListe = [];
function majHeureAff() {
  const h = pasListe[heureInput.value];
  heureAff.textContent = h;
  legendeHeure.textContent = `à ${h}`;
  const pos = heureInput.max > 0 ? (100 * heureInput.value / heureInput.max) : 0;
  heureInput.style.setProperty("--pos", pos + "%");
}
function majDate() {
  pasListe = manifest.dates[dateSel.value];
  heureInput.min = 0; heureInput.max = pasListe.length - 1;
  const quinze = pasListe.indexOf("15:00");
  heureInput.value = quinze >= 0 ? quinze : Math.floor(pasListe.length / 2);
  majHeureAff();
}
majDate();

let kActuel = 0, points = [], calculEnCours = 0;
const LIBELLE_MODE = { 0: "Direct", 1: "Équilibré", 4: "Ombre max" };
// Reference du pourcentage de detour ("+X % vs le plus court") : le VRAI plus
// court chemin du reseau, meme A* a k = 0 et penalite de traversee 0
// (parametre optionnel facteurTraversee du moteur, defaut 1 : moteur.js
// intouche). Le mode Direct garde ses penalites (15 m passage pieton, 30 m
// carrefour) : c'est un itineraire marchable qui evite les traversees, pas le
// plus court, et il est compare a la meme reference que les deux autres.
// Calculee une fois par couple depart/arrivee (elle ne depend ni du mode ni
// de l'heure : a k = 0 l'ombre n'entre pas dans le cout), jamais affichee
// sur la carte. Le plafond de detour x1,5 du moteur reste base sur la route
// Direct penalisee (contrat de parite Python/JS, graph.route_avec_plafond).
let reference = null; // { cle, distance_m }
async function referenceDetour() {
  const cle = points.map((p) => p.join(",")).join("|");
  if (!reference || reference.cle !== cle) {
    const ref = await moteur.route({
      depart: points[0], arrivee: points[1], k: 0, facteurTraversee: 0,
      date: dateSel.value, heure: pasListe[heureInput.value], chargerToutes: true,
    });
    reference = { cle, distance_m: ref.reachable ? ref.distance_m : null };
  }
  return reference.distance_m;
}

const [lonMin, latMin, lonMax, latMax] = manifest.bbox_wgs84;
const map = new maplibregl.Map({
  container: "map",
  style: { version: 8, sources: { osm: { type: "raster",
    tiles: ["https://tile.openstreetmap.org/{z}/{x}/{y}.png"], tileSize: 256,
    attribution: "&copy; OpenStreetMap contributors" } },
    layers: [{ id: "osm", type: "raster", source: "osm" }] },
  bounds: [[lonMin, latMin], [lonMax, latMax]], fitBoundsOptions: { padding: { top: 150, bottom: 110, left: 20, right: 20 } },
  attributionControl: false,
});
map.addControl(new maplibregl.AttributionControl({ compact: true }), "top-right");

const couleurTrottoir = ["case", ["get", "indetermine"], "#9e9e9e",
  ["interpolate", ["linear"], ["coalesce", ["get", "fraction_ombre"], 0], 0, "#f0a202", 1, "#1565c0"]];
const couleurClasse = ["match", ["get", "classe"],
  "ombre", "#0b3d91", "soleil", "#e65100", "indetermine", "#616161", "#6a1b9a"];

// Quand un trajet est affiche, la couche trottoirs s'efface pour laisser
// ressortir le trace (meme palette, opacite reduite).
const OPACITE_TROTTOIRS = { libre: 1, trajet: 0.32 };
function attenuerTrottoirs(trajetAffiche) {
  if (map.getLayer("trottoirs")) map.setPaintProperty("trottoirs", "line-opacity", trajetAffiche ? OPACITE_TROTTOIRS.trajet : OPACITE_TROTTOIRS.libre);
}

map.on("load", async () => {
  map.addSource("trottoirs", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "trottoirs", type: "line", source: "trottoirs",
    paint: { "line-color": couleurTrottoir, "line-width": 2.5, "line-opacity": OPACITE_TROTTOIRS.libre } });
  map.addSource("route", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "route-casing", type: "line", source: "route",
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": "#fff", "line-width": 9, "line-opacity": .9 } });
  map.addLayer({ id: "route-marche", type: "line", source: "route",
    filter: ["!", ["in", ["get", "classe"], ["literal", ["traversee", "liaison"]]]],
    layout: { "line-cap": "round", "line-join": "round" },
    paint: { "line-color": couleurClasse, "line-width": 5 } });
  map.addLayer({ id: "route-traversee", type: "line", source: "route",
    filter: ["in", ["get", "classe"], ["literal", ["traversee", "liaison"]]],
    paint: { "line-color": "#6a1b9a", "line-width": 4, "line-dasharray": [1, 1.2] } });
  map.addSource("points", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "points", type: "circle", source: "points",
    paint: { "circle-radius": 8, "circle-color": ["match", ["get", "role"], "depart", "#00695c", "#6a1b9a"],
      "circle-stroke-width": 2.5, "circle-stroke-color": "#fff" } });
  map.on("click", (e) => poserPoint([e.lngLat.lng, e.lngLat.lat]));
  await majTrottoirs();
  finProgres();
  statutEl.textContent = MSG_INVITE;
});

async function majTrottoirs() {
  await moteur.chargeOmbres(dateSel.value);
  map.getSource("trottoirs").setData(moteur.trottoirsGeoJSON(dateSel.value, pasListe[heureInput.value]));
}

function majPoints() {
  map.getSource("points").setData({ type: "FeatureCollection", features: points.map((p, i) => ({
    type: "Feature", geometry: { type: "Point", coordinates: p },
    properties: { role: i === 0 ? "depart" : "arrivee" } })) });
}

function montrerStatut(texte) {
  resultatEl.hidden = true;
  statutEl.hidden = false;
  statutEl.textContent = texte;
  basEl.classList.add("replie");
}

function poserPoint(coord) {
  if (points.length >= 2) effacer(false);
  points.push(coord);
  majPoints();
  if (points.length === 1) { montrerStatut("Départ posé. Touchez l'arrivée."); return; }
  calculer();
}

function effacer(toutEffacerUI = true) {
  points = [];
  reference = null;
  majPoints();
  map.getSource("route").setData({ type: "FeatureCollection", features: [] });
  attenuerTrottoirs(false);
  instructionsEl.innerHTML = "";
  if (toutEffacerUI) montrerStatut(MSG_INVITE);
}

// "Rue de Turenne, cote ouest" -> { rue, cote } pour l'affichage (le moteur
// produit le texte sans accents ; on ne le modifie pas, on le presente).
function decomposeMarche(texte) {
  const m = /^(.*?),\s*cote\s+(\S+)$/.exec(texte);
  return m ? { rue: m[1], cote: `côté ${m[2]}` } : { rue: texte, cote: "" };
}
const svgTrav = () => {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("viewBox", "0 0 24 24");
  s.innerHTML = '<path d="M4 12h16M14 6l6 6-6 6"/>';
  return s;
};

function rendreInstructions(instructions) {
  instructionsEl.innerHTML = "";
  let i = 0;
  while (i < instructions.length) {
    const inst = instructions[i];
    if (inst.type !== "marche") {
      // Traversees consecutives regroupees en une ligne.
      let n = 0, pieton = 0;
      while (i < instructions.length && instructions[i].type !== "marche") { n += 1; if (/pieton/.test(instructions[i].texte)) pieton += 1; i += 1; }
      const li = document.createElement("li");
      li.className = "trav";
      li.appendChild(svgTrav());
      let t = n === 1 ? "1 traversée" : `${n} traversées`;
      if (pieton === n) t += " au passage piéton";
      else if (pieton === 0) t += " au carrefour";
      li.appendChild(document.createTextNode(t));
      instructionsEl.appendChild(li);
      continue;
    }
    const { rue, cote } = decomposeMarche(inst.texte);
    const notes = [];
    if (cote) notes.push(cote);
    if (inst.indetermine) notes.push("passage couvert en partie");
    if (inst.confiance_faible) notes.push("fiabilité faible");
    const li = document.createElement("li");
    const nom = document.createElement("span"); nom.className = "rue"; nom.textContent = rue;
    if (notes.length) { const sm = document.createElement("small"); sm.textContent = notes.join(" · "); nom.appendChild(sm); }
    const mes = document.createElement("span"); mes.className = "mes";
    const b = document.createElement("b"); b.textContent = `${inst.distance_m} m`; mes.appendChild(b);
    if (inst.pct_ombre !== null) mes.appendChild(document.createTextNode(` · ${inst.pct_ombre} % ombre`));
    li.append(nom, mes);
    instructionsEl.appendChild(li);
    i += 1;
  }
}

async function calculer() {
  if (points.length !== 2) return;
  const id = ++calculEnCours;
  const etaitDeplie = !resultatEl.hidden && !basEl.classList.contains("replie");
  montrerStatut("Calcul…");
  const r = await moteur.route({
    depart: points[0], arrivee: points[1], k: kActuel,
    date: dateSel.value, heure: pasListe[heureInput.value], chargerToutes: true,
  });
  if (id !== calculEnCours) return;
  if (!r.reachable) { montrerStatut(r.message); return; }
  const plusCourt = await referenceDetour();
  if (id !== calculEnCours) return;
  mesure("itineraire-calcule");
  const { troncons, instructions } = moteur.detaillerTrace(r, points[0], points[1]);
  map.getSource("route").setData({ type: "FeatureCollection", features: troncons.map((t) => ({
    type: "Feature", geometry: { type: "LineString", coordinates: t.coords }, properties: { classe: t.classe } })) });
  attenuerTrottoirs(true);

  // Heros : "94 % du trajet a l'ombre". Sans trottoir evalue sur le trajet
  // (points sur le meme segment, traversees seules), il n'y a pas de chiffre :
  // "ombre non evaluee" plutot qu'un "? %" bancal.
  const evaluable = r.fraction_ombre_trajet !== null;
  $("pct").innerHTML = evaluable ? `${Math.round(r.fraction_ombre_trajet * 100)}<small> %</small>` : "";
  $("hero-libelle").textContent = evaluable ? "du trajet à\u00a0l'ombre" : "ombre non évaluée";
  $("mode-aff").textContent = LIBELLE_MODE[r.k_demande] ?? `k = ${r.k_demande}`;
  const morceaux = [`<b>${Math.round(r.distance_m).toLocaleString("fr-FR")} m</b>`];
  // Detour par rapport au vrai plus court chemin du reseau (cf. referenceDetour),
  // sur les trois modes, masque quand il arrondit a 0 %. Le ratio_detour du
  // moteur (base Direct penalisee) n'est plus affiche.
  if (plusCourt) {
    const detour = Math.round((r.distance_m / plusCourt - 1) * 100);
    if (detour >= 1) morceaux.push(`+${detour} % vs le plus court`);
  }
  if (r.plafonne) morceaux.push(`<span class="alerte">détour plafonné, k = ${r.k_effectif}</span>`);
  morceaux.push(r.nb_traversees === 1 ? "1 traversée" : `${r.nb_traversees} traversées`);
  morceaux.push(`départ ${r.heure}`);
  $("sous").innerHTML = morceaux.join(" · ");
  rendreInstructions(instructions);

  // Premier resultat : panneau replie (la carte d'abord). Recalcul (mode,
  // heure) : on garde l'etat choisi par l'utilisateur.
  basEl.classList.toggle("replie", !etaitDeplie);
  statutEl.hidden = true;
  resultatEl.hidden = false;
}

// Panneau resultat : replie (resume seul) ou deplie (etapes). Toucher la
// poignee ou le resume bascule ; un glissement vertical aussi.
function basculerPanneau(deplier) {
  if (resultatEl.hidden) return;
  basEl.classList.toggle("replie", deplier === undefined ? !basEl.classList.contains("replie") : !deplier);
}
$("poignee").addEventListener("click", () => basculerPanneau());
$("hero").addEventListener("click", () => basculerPanneau());
let touchY0 = null;
basEl.addEventListener("touchstart", (e) => { touchY0 = e.touches[0].clientY; }, { passive: true });
basEl.addEventListener("touchend", (e) => {
  if (touchY0 === null) return;
  const dy = e.changedTouches[0].clientY - touchY0; touchY0 = null;
  if (dy < -30) basculerPanneau(true);
  else if (dy > 30 && instructionsEl.scrollTop === 0) basculerPanneau(false);
}, { passive: true });

document.querySelectorAll("#modes button[data-k]").forEach((b) => b.addEventListener("click", () => {
  kActuel = parseFloat(b.dataset.k);
  if (kActuel === 4) mesure("mode-ombre-max");
  document.querySelectorAll("#modes button[data-k]").forEach((x) => x.classList.toggle("actif", x === b));
  calculer();
}));
$("btn-effacer").addEventListener("click", () => effacer());
$("btn-geoloc").addEventListener("click", () => {
  if (!navigator.geolocation) { montrerStatut("Géolocalisation indisponible."); return; }
  montrerStatut("Recherche de votre position…");
  navigator.geolocation.getCurrentPosition((pos) => {
    const c = [pos.coords.longitude, pos.coords.latitude];
    const marge = 0.01; // ~1 km : hors perimetre demonstrateur -> message clair
    if (c[0] < lonMin - marge || c[0] > lonMax + marge || c[1] < latMin - marge || c[1] > latMax + marge) {
      montrerStatut("Vous êtes hors du périmètre couvert (" + manifest.perimetre + ") — touchez la carte à la place.");
      return;
    }
    effacer(false);
    poserPoint(c);
    map.flyTo({ center: c, zoom: 15.5 });
    montrerStatut("Départ = votre position. Touchez l'arrivée.");
  }, () => { montrerStatut("Position refusée ou indisponible — touchez la carte."); },
  { enableHighAccuracy: true, timeout: 8000 });
});
heureInput.addEventListener("input", majHeureAff);
heureInput.addEventListener("change", async () => { await majTrottoirs(); calculer(); });
dateSel.addEventListener("change", async () => { majDate(); await majTrottoirs(); calculer(); });
</script>
</body>
